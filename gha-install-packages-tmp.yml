name: Install packages
description: >-
  Install optional system (apt) and Python (pip) packages before a later step
  needs them — e.g. a computer algebra system (`maxima` / `sympy`) so an
  @claude agent or reviewer's Bash tool can symbolically check a math-heavy
  repo's derivations. Both inputs are space-separated package lists and empty
  by default; each step is skipped entirely when its input is empty.
inputs:
  apt-packages:
    description: Space-separated system packages to `apt-get install`.
    default: ''
  pip-packages:
    description: >-
      Space-separated pip packages to install (`pip3 install
      --break-system-packages`).
    default: ''
runs:
  using: composite
  steps:
    - name: Install apt packages
      if: inputs.apt-packages != ''
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        sudo apt-get update
        # Pipe through xargs rather than unquoted word-splitting so any shell
        # metacharacters in the input are passed to apt-get as literal args
        # (which it rejects) instead of being interpreted by the shell.
        echo "$APT_PACKAGES" | xargs sudo apt-get install -y

    - name: Install pip packages
      if: inputs.pip-packages != ''
      shell: bash
      env:
        PIP_PACKAGES: ${{ inputs.pip-packages }}
      run: echo "$PIP_PACKAGES" | xargs pip3 install --break-system-packages
