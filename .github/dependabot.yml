# Keep git submodules and pinned GitHub Actions up to date automatically.
#
# This repo embeds the shared `macros` repo as a git submodule (at
# `latex-macros/`, tracking `main`). Dependabot's `gitsubmodule` updater opens a
# PR whenever the tracked branch advances, so we no longer have to bump the
# pointer by hand. See the ADR at d-morrison/macros
# (docs/adr/0001-macros-submodule-versioning.md) for why we track `main` rather
# than a pinned release tag.
version: 2
updates:
  # No cooldown here, deliberately. A cooldown exists to delay adopting a
  # third-party release before anyone has looked at it. The only submodules
  # here are d-morrison/macros and Morrison-Lab/ai-config, both first-party and
  # both tracked at `main` on purpose -- delaying our own macro changes by a
  # week would slow every chapter that uses them, for no supply-chain gain.
  - package-ecosystem: "gitsubmodule"  # zizmor: ignore[dependabot-cooldown]
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(submodule)"
    # macros changes ripple through every chapter that uses them, so each bump
    # PR needs the Quarto freeze cache cleared; this label keeps that visible.
    labels:
      - "clear freezer"

  # Also keep pinned GitHub Actions current. Dependabot scans .github/workflows/
  # and opens a PR when a newer release of a pinned action is available;
  # unversioned @HEAD / @main pins are left untouched.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    # Wait before adopting a new release, so a compromised or broken one is
    # not pulled in the hour it ships. Longer for a major, which is the bump
    # most likely to need real review anyway.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
